name: Update fundraising totals

on:
  schedule:
    # Three times a day: about 7 AM, 1 PM and 7 PM Eastern (times are UTC)
    - cron: "0 11 * * *"
    - cron: "0 17 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for an on-demand refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest totals from the DCC site
        run: bash scripts/update-totals.sh
      - name: Save changes
        run: |
          git config user.name "dcc-totals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Update fundraising totals" || echo "No changes"
          git push
